    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem("arslan_weblab_theme") || "original";
          var validThemes = ["original", "system", "light", "black"];
          if (validThemes.indexOf(savedTheme) === -1) savedTheme = "original";
          var resolved = savedTheme;
          if (savedTheme === "system") {
            var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            resolved = prefersDark ? "original" : "light";
          }
          document.documentElement.setAttribute("data-selected-theme", savedTheme);
          document.documentElement.setAttribute("data-theme", resolved);
          var savedLang = localStorage.getItem("arslan_weblab_lang") || "en";
          if (savedLang !== "en" && savedLang !== "ur") savedLang = "en";
          document.documentElement.setAttribute("lang", savedLang);
          document.documentElement.setAttribute("dir", savedLang === "ur" ? "rtl" : "ltr");
          if (localStorage.getItem("arslan_weblab_high_contrast") === "true") {
            document.documentElement.setAttribute("data-high-contrast", "true");
          }
          if (localStorage.getItem("arslan_weblab_reduced_motion") === "true") {
            document.documentElement.setAttribute("data-reduced-motion", "true");
          }
        } catch (e) {}
      })();
    </script>
